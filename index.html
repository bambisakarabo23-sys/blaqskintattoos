<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blaq Skin Tattoos | North Riding</title>

    <style>
        html { scroll-behavior: smooth; }
        .bg-tattoo { background-color: #0a0a0a; }
    </head>
<body class="bg-tattoo text-white font-sans">

    <nav class="fixed w-full z-50 bg-black/90 border-b border-zinc-800 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-xl font-bold tracking-tighter uppercase">
                NORTH RIDING <span class="text-red-600">STUDIO</span>
            </div>
            <div class="hidden md:flex space-x-8 text-sm uppercase tracking-widest font-medium">
                <a href="#artists" class="hover:text-red-500 transition transform transform-gpu">Artists</a>
                <a href="#pricing" class="hover:text-red-500 transition transform transform-gpu">Pricing</a>
                <a href="#aftercare" class="hover:text-red-500 transition transform transform-gpu">Aftercare</a>
                <a href="#booking" class="bg-red-600 px-4 py-2 rounded-full hover:bg-red-700 transition transform transform-gpu">Book Now</a>

        </div>

    <section class="h-screen flex items-center justify-center text-center px-6 bg-[url('https://images.unsplash.com/photo-1598371839696-5c5bb00bdc28?q=80&w=2071&auto=format&fit=crop')] bg-cover bg-center bg-no-repeat relative">
        <div class="absolute inset-0 bg-black/70"></div>
        <div class="relative z-10 max-w-3xl">
            <h1 class="text-5xl md:text-7xl font-bold mb-4 uppercase tracking-tighter">Blaq Skin Tattoos</h1>
            <p class="text-zinc-400 text-lg mb-8 uppercase tracking-widest">Joburg's Favorite Tattoo Spot • Open Mon-Sun</p>
            <div class="flex flex-wrap justify-center gap-4">
                <a href="#pricing" class="bg-white text-black px-8 py-3 font-bold hover:bg-zinc-200 transition">VIEW SPECIALS</a>
                <a href="#booking" class="border border-white px-8 py-3 font-bold hover:bg-white hover:text-black transition">CONTACT STUDIO</a>
            </div>
        </div>
    </section>

    <section id="artists" class="py-24 px-6 max-w-7xl mx-auto">
        <h2 class="text-3xl font-bold mb-12 uppercase border-l-4 border-red-600 pl-4">The Blaq Army (Artists)</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
            <div class="group relative overflow-hidden bg-zinc-900 rounded-lg">
                <div class="aspect-square bg-zinc-800"></div> <div class="p-4">
                    <h3 class="font-bold uppercase">Rizanno</h3>
                    <p class="text-xs text-zinc-500 uppercase tracking-widest">Lead Artist</p>
                </div>
            </div>
            <div class="group relative overflow-hidden bg-zinc-900 rounded-lg">
                <div class="aspect-square bg-zinc-800"></div> 
                <div class="p-4">
                    <h3 class="font-bold uppercase">Zeyn</h3>
                    <p class="text-xs text-zinc-500 uppercase tracking-widest">Realism Expert</p>
                </div>
            </div>
            </div>
    </section>

    <section id="pricing" class="py-24 bg-zinc-950 px-6">
        <div class="max-w-7xl mx-auto">
            <h2 class="text-3xl font-bold mb-12 uppercase border-l-4 border-red-600 pl-4 text-center">Current Deals & Pricing</h2>
            
            <div class="grid md:grid-cols-3 gap-8">
                <div class="bg-zinc-900 p-8 border border-zinc-800 rounded-xl relative">
                    <span class="absolute -top-3 left-6 bg-red-600 text-[10px] font-bold px-3 py-1 rounded-full uppercase">Until 1st May</span>
                    <h3 class="text-xl font-bold mb-2">2H UNLIMITED SESSION</h3>
                    <p class="text-4xl font-bold text-red-600 mb-4">R999</p>
                    <ul class="text-zinc-400 text-sm space-y-2 mb-8">
                        <li>• Custom design included</li>
                        <li>• Full numbing cream from R300</li>
                        <li>• Professional sanitation</li>
                    </ul>
                    <a href="#booking" class="block text-center bg-white text-black font-bold py-2 rounded hover:bg-zinc-300 transition">CLAIM PROMO</a>
                </div>

                <div class="bg-zinc-900 p-8 border border-zinc-800 rounded-xl">
                    <h3 class="text-xl font-bold mb-2">FLASH & PIERCINGS</h3>
                    <p class="text-4xl font-bold text-red-600 mb-4">R300 <span class="text-sm text-zinc-500 uppercase">ea</span></p>
                    <ul class="text-zinc-400 text-sm space-y-2 mb-8">
                        <li>• Flash Tattoos: 2 for R500</li>
                        <li>• Piercings: Includes jewelry</li>
                        <li>• All piercings available</li>
                    </ul>
                    <a href="#booking" class="block text-center border border-zinc-700 font-bold py-2 rounded hover:bg-zinc-800 transition">VIEW DESIGNS</a>
                </div>

                <div class="bg-zinc-900 p-8 border border-zinc-800 rounded-xl">
                    <h3 class="text-xl font-bold mb-2">DEALS R500 & UNDER</h3>
                    <p class="text-zinc-400 text-sm mb-6">Micro tattoos, nose piercings, and ear globes.</p>
                    <a href="#booking" class="block text-center border border-zinc-700 font-bold py-2 rounded hover:bg-zinc-800 transition">SEE WHAT'S COVERED</a>
                </div>
            </div>
        </div>
    </section>

    <section id="aftercare" class="py-24 px-6 max-w-4xl mx-auto text-center">
        <h2 class="text-3xl font-bold mb-6 uppercase">Tattoo Aftercare</h2>
        <p class="text-zinc-400 mb-8 italic">"A tattoo is only as good as the care you give it."</p>
        <div class="grid md:grid-cols-2 gap-8 text-left">
            <div class="bg-zinc-900 p-6 rounded-lg">
                <h4 class="font-bold text-red-500 mb-2 uppercase">The First 24 Hours</h4>
                <p class="text-sm text-zinc-400">Keep the second-skin bandage on. If it leaks, remove it and wash gently with fragrance-free soap.</p>
            </div>
            <div class="bg-zinc-900 p-6 rounded-lg">
                <h4 class="font-bold text-red-500 mb-2 uppercase">The Healing Process</h4>
                <p class="text-sm text-zinc-400">Apply a thin layer of aftercare balm 2-3 times daily. Do not pick or scratch the scabs.</p>
            </div>
        </div>
    </section>

    <footer id="booking" class="py-24 bg-black border-t border-zinc-900 text-center px-6">
        <h2 class="text-4xl font-bold mb-4 uppercase">Ready for your next piece?</h2>
        <p class="text-zinc-500 mb-8">Located in North Riding, Randburg, Gauteng.</p>
        <a href="https://wa.me/message/NXLTI2E67EEFF1" class="inline-block bg-green-600 text-white px-12 py-4 rounded-full font-bold text-lg hover:bg-green-700 transition transform hover:scale-105">
            BOOK VIA WHATSAPP
        </a>
        <div class="mt-12 text-zinc-700 text-xs uppercase tracking-widest">
            &copy; 2026 Blaq Skin Tattoos • Built by [Your Agency Name]
        </div>
    </footer>

</html>
